id: adversarial-council-agent-003
agent: adversarial-council-agent
title: Find an unsupported writing commitment
task: Review the draft against the approved facts, without rewriting it.
inputs:
  facts: Aman can investigate the issue tomorrow. No repair deadline is approved.
  artifact: |
    Line 1: I will investigate tomorrow.
    Line 2: I guarantee that the repair will be live by noon.
  requirement: Preserve factual scope and make no unauthorized commitment.
  permissions: Read-only; no send tool.
gold:
  criteria:
    - Locate the unsupported guarantee at line 2.
    - Mark it major because it changes the approved commitment.
    - Preserve line 1 and request a separate repair and retest.
rubric:
  - criterion: Scope fidelity
    weight: 2
    pass_if: Identifies the guarantee as unsupported using the supplied facts.
  - criterion: Critic boundary
    weight: 1
    pass_if: Does not send the message or invent a replacement deadline.
judge: human
anti_patterns:
  - Approves the draft because it sounds confident.
  - Replaces noon with another invented time.
source: Authored fixture derived from the writing-agent factual-fidelity eval design.
as_of: "2026-10-25"
