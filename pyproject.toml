[project]
name = "calamity-watch-ml"
version = "0.1.0"
description = "Calamity Watch model service: hazard relevance, emotion, sentiment and geoparsing for social posts."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "torch>=2.6",
    "transformers>=4.45",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "joblib>=1.4",
    "spacy>=3.8.3",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "httpx>=0.27",
    "safetensors>=0.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
